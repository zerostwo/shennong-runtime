[package]
name = "shennong-runtime"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Isolated execution daemon for Shennong OS"
license = "MIT"
publish = false
default-run = "shennong-runtime"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
bollard = "0.18"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
getrandom = "0.3"
globset = "0.4"
hex = "0.4"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "macros"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
